
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devendra's Dynamic DIV List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f5ff;
            margin: 30px;
        }

        h1 {
            color: darkblue;
        }

        input {
            padding: 10px;
            font-size: 16px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            border: 1px solid darkblue;
            border-radius: 5px;
            cursor: pointer;
        }

        #addEndButton {
            background-color: lightgreen;
        }

        #addFrontButton {
            background-color: lightblue;
        }

        #removeButton {
            background-color: lightcoral;
        }

        #shuffleButton {
            background-color: khaki;
        }

        .flex-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            background-color: #dce8ff;
            padding: 20px;
            margin-top: 25px;
            gap: 10px;
        }

        .divlist {
            background-color: white;
            border: 2px solid darkblue;
            border-radius: 5px;
            padding: 20px;
            min-width: 70px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Devendra Derangula builds list with divs</h1>

    <p>Add items, remove every other item, or shuffle two items.</p>

    <input type="text" id="itemInput" placeholder="Enter an item">

    <button id="addEndButton" onclick="addEnd()">Add end</button>

    <button id="addFrontButton" onclick="addFront()">Add front</button>

    <button id="removeButton" onclick="removeEveryOther()">Remove</button>

    <button id="shuffleButton" onclick="shuffle()">Shuffle</button>

    <div class="flex-container" id="container">
        <div class="divlist">Apple</div>
        <div class="divlist">Banana</div>
        <div class="divlist">Cherry</div>
    </div>

    <script>
        // Add item to the end
        function addEnd() {
            let input = document.getElementById("itemInput");
            let value = input.value.trim();

            if (value === "") {
                alert("Please enter an item.");
                return;
            }

            let newDiv = document.createElement("div");
            newDiv.textContent = value;
            newDiv.className = "divlist";

            let container = document.getElementById("container");
            container.appendChild(newDiv);

            input.value = "";
        }

        // Add item to the front
        function addFront() {
            let input = document.getElementById("itemInput");
            let value = input.value.trim();

            if (value === "") {
                alert("Please enter an item.");
                return;
            }

            let newDiv = document.createElement("div");
            newDiv.textContent = value;
            newDiv.className = "divlist";

            let container = document.getElementById("container");
            container.insertBefore(newDiv, container.firstChild);

            input.value = "";
        }

        // Remove every other element
        function removeEveryOther() {
            let divListItems =
                document.getElementsByClassName("divlist");

            let items = Array.from(divListItems);

            for (let i = 0; i < items.length; i += 2) {
                items[i].remove();
            }
        }

        // BONUS: Shuffle two random elements
        function shuffle() {
            let container = document.getElementById("container");

            let items = container.getElementsByClassName("divlist");

            if (items.length < 2) {
                alert("Add at least two items to shuffle.");
                return;
            }

            // Generate two different random positions
            let first = Math.floor(Math.random() * items.length);
            let second = Math.floor(Math.random() * items.length);

            while (first === second) {
                second = Math.floor(Math.random() * items.length);
            }

            // Swap the contents of the two elements
            let temp = items[first].textContent;

            items[first].textContent = items[second].textContent;
            items[second].textContent = temp;

            console.log("Swapped positions " + first + " and " + second);
        }
    </script>

</body>
</html>
