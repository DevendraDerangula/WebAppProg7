
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Devendra's Random Reflex Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #eef5ff;
            margin-top: 80px;
        }

        h1 {
            color: darkblue;
        }

        #target {
            font-size: 24px;
            margin: 20px;
        }

        #counter {
            font-size: 30px;
            font-weight: bold;
            margin: 20px;
            color: darkred;
        }

        button {
            padding: 12px 30px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid darkblue;
        }

        #goButton {
            background-color: lightgreen;
        }

        #haltButton {
            background-color: lightcoral;
        }
    </style>
</head>

<body>

    <h1>Devendra Derangula reflexes</h1>

    <div id="target">Your time</div>

    <div id="counter">Count</div>

    <button id="goButton" onclick="beginTime()">Go</button>

    <button id="haltButton" onclick="recordTime()">Halt</button>

    <script>
        let haltTime = undefined;
        let startTime = undefined;
        let gameRunning = false;
        let timers = [];

        // Record when Halt is pressed
        function recordTime() {
            if (!gameRunning || haltTime !== undefined) {
                return;
            }

            haltTime = Date.now();

            console.log("Halt time: " + haltTime);
        }

        // Start the random countdown
        function beginTime() {

            // Clear any previous countdown timers
            for (let timer of timers) {
                clearTimeout(timer);
            }

            timers = [];
            haltTime = undefined;
            startTime = Date.now();
            gameRunning = true;

            // BONUS: Generate a random number from 2 to 10
            let randomCount =
                Math.floor(Math.random() * 9) + 2;

            console.log("Random starting number: " + randomCount);

            document.getElementById("target").innerHTML =
                "Try to stop as close to zero as possible!";

            // Display the random starting number immediately
            document.getElementById("counter").innerHTML =
                "Count: " + randomCount;

            // Countdown from randomCount to zero
            for (let i = randomCount - 1; i >= 0; i--) {

                let timer = setTimeout(function() {

                    document.getElementById("counter").innerHTML =
                        "Count: " + i;

                }, (randomCount - i) * 1000);

                timers.push(timer);
            }

            // Check the result when the countdown reaches zero
            let resultTimer = setTimeout(function() {

                gameRunning = false;

                if (haltTime === undefined) {

                    document.getElementById("target").innerHTML =
                        "Not soon enough";

                } else {

                    let targetTime =
                        startTime + randomCount * 1000;

                    let elapsedTime =
                        targetTime - haltTime;

                    document.getElementById("target").innerHTML =
                        "Time was " + elapsedTime +
                        " milliseconds";
                }

            }, randomCount * 1000);

            timers.push(resultTimer);
        }
    </script>

</body>
</html>
