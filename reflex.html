
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Devendra's Reflex Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #eef5ff;
            margin-top: 80px;
        }

        h1 {
            color: darkblue;
        }

        #target {
            font-size: 24px;
            margin: 20px;
        }

        #counter {
            font-size: 30px;
            font-weight: bold;
            margin: 20px;
            color: darkred;
        }

        button {
            padding: 12px 30px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid darkblue;
        }

        #goButton {
            background-color: lightgreen;
        }

        #haltButton {
            background-color: lightcoral;
        }
    </style>
</head>

<body>

    <h1>Devendra Derangula reflexes</h1>

    <div id="target">Your time</div>

    <div id="counter">Count</div>

    <button id="goButton" onclick="beginTime()">Go</button>

    <button id="haltButton" onclick="recordTime()">Halt</button>

    <script>
        let haltTime = undefined;
        let startTime = undefined;
        let gameRunning = false;
        let timers = [];

        // Record when Halt is pressed
        function recordTime() {
            if (!gameRunning || haltTime !== undefined) {
                return;
            }

            haltTime = Date.now();
            console.log("Halt time: " + haltTime);
        }

        // Start the countdown
        function beginTime() {
            // Clear previous countdowns
            for (let timer of timers) {
                clearTimeout(timer);
            }

            timers = [];
            haltTime = undefined;
            startTime = Date.now();
            gameRunning = true;

            document.getElementById("target").innerHTML =
                "Try to stop as close to zero as possible!";

            // Countdown from 5 to 0
            for (let i = 0; i <= 5; i++) {
                let timer = setTimeout(function() {
                    document.getElementById("counter").innerHTML =
                        "Count: " + i;
                }, (5 - i) * 1000);

                timers.push(timer);
            }

            // Check the result after 5 seconds
            let resultTimer = setTimeout(function() {
                gameRunning = false;

                if (haltTime === undefined) {
                    document.getElementById("target").innerHTML =
                        "Not soon enough";
                }
                else {
                    let targetTime = startTime + 5000;
                    let elapsedTime = targetTime - haltTime;

                    document.getElementById("target").innerHTML =
                        "Time was " + elapsedTime + " milliseconds";
                }
            }, 5000);

            timers.push(resultTimer);
        }
    </script>

</body>
</html>
