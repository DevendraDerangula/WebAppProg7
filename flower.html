
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devendra's Random Flower Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8f0;
            margin: 20px;
        }

        h1 {
            color: darkgreen;
        }

        p {
            font-size: 17px;
        }

        .game-row {
            display: flex;
            justify-content: center;
        }

        .game-cell {
            margin: 3px;
        }

        .game-cell img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border: 2px solid darkgreen;
            border-radius: 5px;
            cursor: pointer;
        }

        #gameBoard {
            margin-top: 20px;
        }

        #helpButton {
            cursor: pointer;
            color: darkgreen;
            font-weight: bold;
            text-decoration: underline;
        }

        #restartButton {
            background-color: lightgreen;
            border: 1px solid darkgreen;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Devendra Derangula finds avians</h1>

    <p>
        Click on the locations to find the flowers,
        watch out for the poison ivy
    </p>

    <p id="locations">
        Number of locations checked is zero.
    </p>

    <p id="score">
        Score is zero.
    </p>

    <p id="helpButton" onclick="help()">
        Click for help.
    </p>

    <p id="help">Help report</p>

    <button id="restartButton" onclick="location.reload()">
        New Game
    </button>

    <div id="gameBoard"></div>

    <script>
        let ids = [];
        let score = 0;
        let locationsVisited = 0;
        let lastLocation = 0;
        let gameOver = false;
        let visited = [];

        // BONUS: Generate unique random locations
        let availableLocations = [];

        for (let i = 0; i < 36; i++) {
            availableLocations.push(i);
        }

        function getRandomLocation() {
            let randomIndex = Math.floor(
                Math.random() * availableLocations.length
            );

            return availableLocations.splice(randomIndex, 1)[0];
        }

        // BONUS: Random poison ivy, rose, lilies and daisies
        let poisonLocation = getRandomLocation();
        let roseLocation = getRandomLocation();

        let lilyLocations = [
            getRandomLocation(),
            getRandomLocation()
        ];

        let daisyLocations = [
            getRandomLocation(),
            getRandomLocation(),
            getRandomLocation(),
            getRandomLocation(),
            getRandomLocation()
        ];

        // Create the 6 by 6 board
        const board = document.getElementById("gameBoard");

        for (let row = 0; row < 6; row++) {
            const rowDiv = document.createElement("div");
            rowDiv.className = "game-row";

            for (let col = 0; col < 6; col++) {
                let position = row * 6 + col;

                let cellDiv = document.createElement("div");
                cellDiv.className = "game-cell";

                let img = document.createElement("img");
                img.src = "images/bush.jpg";
                img.alt = "Bush";
                img.id = "img" + position;

                img.onclick = function() {
                    check(position);
                };

                ids.push(img.id);

                cellDiv.appendChild(img);
                rowDiv.appendChild(cellDiv);
            }

            board.appendChild(rowDiv);
        }

        // BONUS: Move rose one square randomly
        function moveRose() {
            let row = Math.floor(roseLocation / 6);
            let col = roseLocation % 6;

            let possibleMoves = [];

            if (row > 0) {
                possibleMoves.push(roseLocation - 6);
            }

            if (row < 5) {
                possibleMoves.push(roseLocation + 6);
            }

            if (col > 0) {
                possibleMoves.push(roseLocation - 1);
            }

            if (col < 5) {
                possibleMoves.push(roseLocation + 1);
            }

            // Keep rose separate from other special locations
            possibleMoves = possibleMoves.filter(function(pos) {
                return pos !== poisonLocation &&
                       !lilyLocations.includes(pos) &&
                       !daisyLocations.includes(pos);
            });

            if (possibleMoves.length === 0) {
                return;
            }

            let randomMove = Math.floor(
                Math.random() * possibleMoves.length
            );

            roseLocation = possibleMoves[randomMove];
        }

        // Check a location
        function check(position) {
            if (gameOver) {
                return;
            }

            let image = document.getElementById(ids[position]);

            locationsVisited++;

            if (!visited.includes(position)) {
                visited.push(position);

                if (position === poisonLocation) {
                    image.src = "images/poison.jpg";
                    image.alt = "Poison ivy";
                    score -= 4;
                    gameOver = true;
                }
                else if (position === roseLocation) {
                    image.src = "images/rose.jpg";
                    image.alt = "Rose";
                    score += 4;
                }
                else if (lilyLocations.includes(position)) {
                    image.src = "images/lily.jpg";
                    image.alt = "Lily";
                    score += 2;
                }
                else if (daisyLocations.includes(position)) {
                    image.src = "images/daisy.jpg";
                    image.alt = "Daisy";
                    score += 1;
                }
            }

            lastLocation = position;

            // Move the rose after each click
            if (!gameOver) {
                moveRose();

                // If rose lands on the player, game ends
                if (roseLocation === position) {
                    image.src = "images/rose.jpg";
                    image.alt = "Rose";
                    gameOver = true;

                    document.getElementById("help").innerHTML =
                        "Game Over! The moving rose found you.";
                }
            }

            document.getElementById("locations").innerHTML =
                "Number of locations checked is " +
                locationsVisited + ".";

            document.getElementById("score").innerHTML =
                "Score is " + score + ".";

            if (position === poisonLocation) {
                document.getElementById("help").innerHTML =
                    "Game Over! You found the poison ivy.";
            }
        }

        // Help function
        function help() {
            let result = "warm";

            let row = Math.floor(lastLocation / 6);
            let col = lastLocation % 6;

            // Four neighboring positions with wrap around
            let neighbors = [
                (lastLocation + 1) % 36,
                (lastLocation + 35) % 36,
                (lastLocation + 6) % 36,
                (lastLocation + 30) % 36
            ];

            for (let location of neighbors) {
                if (daisyLocations.includes(location)) {
                    result = "cold";

                    document.getElementById("help").innerHTML =
                        "Help report: " + result;
                    return;
                }
            }

            // Nine nearby positions without wrap around
            let nearby = [];

            for (let r = row - 1; r <= row + 1; r++) {
                for (let c = col - 1; c <= col + 1; c++) {
                    if (r >= 0 && r < 6 &&
                        c >= 0 && c < 6) {
                        nearby.push(r * 6 + c);
                    }
                }
            }

            if (nearby.includes(roseLocation)) {
                result = "hot";
            }
            else if (nearby.includes(poisonLocation)) {
                result = "watch out";
            }

            document.getElementById("help").innerHTML =
                "Help report: " + result;
        }
    </script>

</body>
</html>
